# Admin for the app's public lists (dApps, tokens, scam blocklist, banners) in /lists.
#
# How it works: fill in one of the forms under Issues > New issue. If the sender's
# role in team/roles.json allows that change (admin: everything; support: banners,
# messages, dApps, scam blocklist), this workflow applies it to the list, saves it
# to main, replies on the issue and closes it. Other requests stay open until
# someone allowed adds the "approved" label. The app downloads the lists
# from main, so the change reaches phones without a new app build.

name: Wallet lists

on:
  issues:
    types: [opened, labeled]
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  issues: write

concurrency:
  # One change at a time, so two requests never overwrite each other.
  group: wallet-lists
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --no-warnings --test scripts/*.test.mjs

  apply:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.body, '### Action') &&
      (github.event.action == 'opened' || github.event.label.name == 'approved')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # team/roles.json on main decides; on "approved" it checks who added the label.
      - name: Check the sender's role
        id: role
        run: node --no-warnings scripts/roles.mjs "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/out" >> "$GITHUB_OUTPUT"

      - name: Wait for someone allowed
        if: steps.role.outputs.allowed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          LABELED: ${{ github.event.action == 'labeled' }}
        run: |
          gh label create approved --repo "$GITHUB_REPOSITORY" --color 2ea44f --description "Apply this list change" 2>/dev/null || true
          if [ "$LABELED" = true ]; then gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label approved; fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/out/wait.md"

      - name: Apply the request
        if: steps.role.outputs.allowed == 'true'
        id: apply
        run: node --no-warnings scripts/apply-request.mjs "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/out"
        env:
          # Used only to download a banner picture dropped into the form.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Sign the lists
        if: steps.role.outputs.allowed == 'true'
        run: node --no-warnings scripts/sign-lists.mjs
        env:
          LISTS_SIGNING_KEY: ${{ secrets.LISTS_SIGNING_KEY }}

      - name: Save to main
        if: steps.role.outputs.allowed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists
          git commit -F "$RUNNER_TEMP/out/commit.txt"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Reply and close
        if: steps.role.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/out/message.md"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Explain what went wrong
        if: failure() && steps.role.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ ! -s "$RUNNER_TEMP/out/message.md" ] || ! grep -q '^❌' "$RUNNER_TEMP/out/message.md"; then
            echo "❌ Something went wrong while saving this change, so nothing was changed. Please try again in a few minutes." > "$RUNNER_TEMP/out/message.md"
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/out/message.md"
