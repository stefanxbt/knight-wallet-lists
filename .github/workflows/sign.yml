# Signs the lists after a change pushed straight to main (changes made through the issue forms
# are signed by the "Wallet lists" workflow itself). See scripts/sign-lists.mjs.
name: Sign lists

on:
  push:
    branches: [main]
    paths: ['lists/*.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sign-lists
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign
        run: node --no-warnings scripts/sign-lists.mjs
        env:
          LISTS_SIGNING_KEY: ${{ secrets.LISTS_SIGNING_KEY }}
      - name: Save to main
        run: |
          # lists/app-config.json too: signing stamps its "issued" time (see sign-lists.mjs).
          git add lists 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Sign lists"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
