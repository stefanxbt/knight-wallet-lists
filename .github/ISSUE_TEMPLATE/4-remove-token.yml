name: Remove a token
description: Stop showing a token in the app.
title: "Remove a token"
body:
  - type: dropdown
    id: action
    attributes:
      label: Action
      options:
        - Remove a token
      default: 0
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Ethereum
        - BNB Chain
        - Polygon
        - Base
        - Arbitrum
        - Optimism
        - BlackFort
        - Solana
        - Tron
    validations:
      required: true
  - type: input
    id: contract-address
    attributes:
      label: Contract address
    validations:
      required: true
