name: Unblock something
description: Take a token, NFT or website off the scam blocklist.
title: "Unblock something"
body:
  - type: dropdown
    id: action
    attributes:
      label: Action
      options:
        - Unblock something
      default: 0
    validations:
      required: true
  - type: dropdown
    id: what-is-it
    attributes:
      label: What is it?
      options:
        - Token
        - NFT collection
        - Website
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      description: Pick any for a website, it is not used.
      options:
        - Ethereum
        - BNB Chain
        - Polygon
        - Base
        - Arbitrum
        - Optimism
        - BlackFort
        - Solana
        - Tron
    validations:
      required: true
  - type: input
    id: contract-address-or-website
    attributes:
      label: Contract address or website
      description: For a token or NFT, the contract address. For a website, just the address, for example scam-site.com.
    validations:
      required: true
