name: Add a token
description: Show a token in everyone's wallet.
title: "Add a token"
body:
  - type: dropdown
    id: action
    attributes:
      label: Action
      options:
        - Add a token
      default: 0
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Network
      options:
        - Ethereum
        - BNB Chain
        - Polygon
        - BlackFort
        - Solana
        - Tron
    validations:
      required: true
  - type: input
    attributes:
      label: Contract address
      description: Copy it from the token's official website or from CoinGecko (the "Contract" row).
      placeholder: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
    validations:
      required: true
  - type: input
    attributes:
      label: Symbol
      placeholder: USDT
    validations:
      required: true
  - type: input
    attributes:
      label: Token name
      placeholder: Tether USD
    validations:
      required: true
  - type: input
    attributes:
      label: Decimals
      description: Shown on CoinGecko or the block explorer page of the token. Usually 6 or 18.
      placeholder: "18"
    validations:
      required: true
  - type: input
    attributes:
      label: CoinGecko ID
      description: Optional, for the price. It is the last part of the token's CoinGecko address, for example "tether" in coingecko.com/en/coins/tether.
      placeholder: tether
