name: Add a token
description: Show a token in everyone's wallet. Usually you only need the network and the contract address.
title: "Add a token"
body:
  - type: dropdown
    id: action
    attributes:
      label: Action
      options:
        - Add a token
      default: 0
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Ethereum
        - BNB Chain
        - Polygon
        - Base
        - Arbitrum
        - Optimism
        - BlackFort
        - Solana
        - Tron
    validations:
      required: true
  - type: input
    id: contract-address
    attributes:
      label: Contract address
      description: Copy it from the token's official website or from CoinGecko (the "Contract" row).
      placeholder: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
    validations:
      required: true
  - type: input
    id: symbol
    attributes:
      label: Symbol
      description: Optional. Leave it empty and the robot reads it from the network.
      placeholder: USDT
  - type: input
    id: token-name
    attributes:
      label: Token name
      description: Optional. Leave it empty and the robot reads it from the network.
      placeholder: Tether USD
  - type: input
    id: decimals
    attributes:
      label: Decimals
      description: Optional. Leave it empty and the robot reads it from the network.
      placeholder: "18"
  - type: input
    id: coingecko-id
    attributes:
      label: CoinGecko ID
      description: Optional, for the price. It is the last part of the token's CoinGecko address, for example "tether" in coingecko.com/en/coins/tether.
      placeholder: tether
